<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Life</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10160F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poker Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10160F;
    --bg-2: #0B100B;
    --surface: #182019;
    --surface-2: #202B22;
    --surface-3: #283A2D;
    --border: #2B3A2E;
    --text: #EEEBE1;
    --text-dim: #9FAE9E;
    --text-faint: #6C7A6B;
    --felt: #2E6E49;
    --felt-bright: #48A06C;
    --gold: #C9A24B;
    --gold-bright: #E0BC6A;
    --red: #B4523A;
    --red-bright: #D06B50;
    --radius-card: 16px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #F3F1E8; --bg-2: #ECE9DC; --surface: #FFFFFF; --surface-2: #F4F1E6;
    --surface-3: #E9E4D3; --border: #DAD4BF; --text: #1B2119; --text-dim: #56604F;
    --text-faint: #838C77; --felt: #2E6E49; --felt-bright: #3C8A5D; --gold: #A87F26;
    --gold-bright: #C79A3B; --red: #A4432D; --red-bright: #C25A3E;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overflow-x: hidden;
  }
  h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--felt); color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- App shell ---------- */
  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(1200px 400px at 50% -80px, rgba(46,110,73,0.25), transparent 60%),
      var(--bg);
  }

  header.top {
    position: sticky;
    top: var(--safe-top);
    z-index: 20;
    padding: 18px 18px 14px;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
  }
  .brand .suit { color: var(--gold); font-size: 20px; line-height: 1; }
  .brand h1 { font-size: 21px; color: var(--text); }
  .brand .tag { font-size: 12px; color: var(--text-faint); margin-left: auto; align-self: center; }

  .segmented {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 9px 8px;
    border-radius: var(--radius-pill);
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s ease, color .15s ease;
  }
  .segmented button.active {
    background: var(--felt);
    color: #F4FBF6;
  }
  .segmented.tier button { font-size: 12.5px; padding: 9px 4px; }
  .segmented.tier button.active { background: var(--gold); color: #211705; }
  .row-2 { display: flex; gap: 8px; margin-top: 8px; }

  main {
    flex: 1;
    padding: 4px 18px 100px;
  }

  /* ---------- Bottom nav ---------- */
  nav.bottom {
    position: sticky;
    bottom: 0;
    z-index: 30;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom);
  }
  nav.bottom button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-faint);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px 8px;
    font-size: 11.5px;
    font-weight: 500;
  }
  nav.bottom button .ic { font-size: 19px; }
  nav.bottom button.active { color: var(--gold-bright); }
  nav.bottom button.active .ic { color: var(--gold-bright); }

  /* ---------- Cards & common ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 18px;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .section-title { font-size: 13px; text-transform: none; color: var(--text-faint); margin: 22px 0 10px; font-weight: 600; }
  .section-title:first-child { margin-top: 4px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    background: var(--surface-3);
    color: var(--text-dim);
  }
  .pill.gold { background: rgba(201,162,75,0.16); color: var(--gold-bright); }
  .pill.felt { background: rgba(72,160,108,0.18); color: var(--felt-bright); }

  /* ---------- Home ---------- */
  .hero {
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "♠";
    position: absolute;
    right: -18px;
    bottom: -30px;
    font-size: 140px;
    color: rgba(255,255,255,0.03);
    font-family: Georgia, serif;
  }
  .hero .greet { font-size: 22px; margin-bottom: 4px; }
  .hero .sub { color: var(--text-dim); font-size: 14px; line-height: 1.5; max-width: 46ch; }
  .streak-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .streak-flame { font-size: 20px; }
  .streak-count { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; color: var(--gold-bright); }
  .streak-label { color: var(--text-faint); font-size: 12.5px; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; }
  .stat-box .num { font-family: 'Fraunces', serif; font-size: 21px; color: var(--text); }
  .stat-box .lbl { font-size: 10.5px; color: var(--text-faint); margin-top: 3px; line-height: 1.3; }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 15px 16px;
    color: var(--text);
  }
  .action-btn .ic {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }
  .action-btn .ic.felt { background: rgba(72,160,108,0.18); color: var(--felt-bright); }
  .action-btn .ic.gold { background: rgba(201,162,75,0.18); color: var(--gold-bright); }
  .action-btn .ic.red { background: rgba(180,82,58,0.18); color: var(--red-bright); }
  .action-btn .body { flex: 1; }
  .action-btn .ttl { font-weight: 600; font-size: 14.5px; }
  .action-btn .desc { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }
  .action-btn .chev { color: var(--text-faint); font-size: 16px; }
  .action-btn:active { background: var(--surface-2); }

  .insight-card { padding: 14px 16px; }
  .insight-card p { font-size: 13px; color: var(--text-dim); line-height: 1.55; }
  .insight-card .ic-row { display: flex; gap: 10px; align-items: flex-start; }
  .insight-card .ic-row .dot { color: var(--gold-bright); font-size: 13px; margin-top: 2px; }

  /* ---------- Learn ---------- */
  .lesson-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 15px 16px; width: 100%; text-align: left; color: var(--text);
  }
  .lesson-card .num {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; color: var(--text-faint); flex-shrink: 0; font-weight: 600;
  }
  .lesson-card.done .num { background: var(--felt); border-color: var(--felt); color: #fff; }
  .lesson-card .ttl { font-weight: 600; font-size: 14.5px; }
  .lesson-card .teaser { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }
  .lesson-card .chev { margin-left: auto; color: var(--text-faint); }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; color: var(--text-dim);
    font-size: 13.5px; font-weight: 600; padding: 6px 0 14px;
  }
  .lesson-detail h2 { font-size: 21px; line-height: 1.3; margin-bottom: 14px; }
  .lesson-detail p { color: var(--text-dim); font-size: 14.5px; line-height: 1.65; margin-bottom: 12px; }
  .takeaway {
    background: rgba(201,162,75,0.1);
    border: 1px solid rgba(201,162,75,0.35);
    border-radius: var(--radius-sm);
    padding: 14px 15px;
    margin-top: 6px;
  }
  .takeaway .lbl { font-size: 11.5px; font-weight: 700; color: var(--gold-bright); margin-bottom: 5px; }
  .takeaway p { color: var(--text); font-size: 14px; margin: 0; }
  .complete-btn {
    margin-top: 20px; width: 100%;
    background: var(--felt); color: #F4FBF6; border: none;
    border-radius: var(--radius-pill); padding: 14px; font-weight: 600; font-size: 14.5px;
  }
  .complete-btn.done { background: var(--surface-3); color: var(--text-dim); }

  /* ---------- Charts ---------- */
  .chart-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  table.chart { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--surface); }
  table.chart th {
    text-align: left; font-size: 11px; color: var(--text-faint);
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: var(--surface-2); white-space: nowrap; font-weight: 600;
  }
  table.chart td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    color: var(--text-dim); white-space: nowrap;
  }
  table.chart tr:last-child td { border-bottom: none; }
  table.chart td:first-child { color: var(--text); font-weight: 600; }
  .chart-note { font-size: 12.5px; color: var(--text-faint); line-height: 1.55; margin-top: 12px; }

  .view-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .view-toggle button {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 8px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600;
  }
  .view-toggle button.active { background: var(--felt); border-color: var(--felt); color: #F4FBF6; }

  .row-select { width: 100%; margin-bottom: 14px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 11px; color: var(--text); font-size: 13.5px; font-family: inherit; }

  .grid-wrap { overflow-x: auto; }
  table.rgrid { border-collapse: collapse; margin: 0 auto; }
  table.rgrid td {
    width: 25px; height: 25px; min-width: 25px;
    text-align: center; font-size: 9px; font-weight: 700;
    border: 1px solid var(--bg); color: var(--text-faint); background: var(--surface-2);
  }
  table.rgrid td.in { background: var(--gold); color: #211705; }
  table.rgrid td.pairin { background: var(--felt); color: #F4FBF6; }
  .grid-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 11.5px; color: var(--text-faint); align-items: center; }
  .grid-legend .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

  .pf-card { margin-bottom: 18px; }
  .pf-form { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 4px; }
  .pf-field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .pf-field label { font-size: 11px; color: var(--text-faint); font-weight: 600; }
  .pf-field input, .pf-field select {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 11px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .pf-btn { background: var(--gold); color: #211705; border: none; border-radius: var(--radius-sm);
    padding: 11px 16px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
  .pf-result { margin-top: 16px; }
  .pf-result .big { font-family: 'Fraunces', serif; font-size: 30px; color: var(--gold-bright); }
  .pf-result .cap { font-size: 12.5px; color: var(--text-faint); margin-top: -2px; margin-bottom: 12px; }

  /* ---------- Drills ---------- */
  .quiz-progress { display: flex; gap: 5px; margin-bottom: 10px; }
  .quiz-progress .dot { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
  .quiz-progress .dot.on { background: var(--gold); }
  .quiz-progress .dot.right { background: var(--felt); }
  .quiz-progress .dot.wrong { background: var(--red); }
  .review-tag { display: inline-block; margin-bottom: 14px; }
  .compare-wrap { display: flex; gap: 10px; margin-bottom: 18px; }
  .hand-box { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
  .hand-box .lbl { font-size: 10.5px; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .hand-box .name { font-family: 'Fraunces', serif; font-size: 14.5px; color: var(--text); line-height: 1.3; }
  .hand-box .cards { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; }
  .q-text { font-size: 17px; line-height: 1.5; margin-bottom: 18px; font-family: 'Fraunces', serif; font-weight: 500; }
  .opt-btn {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 9px;
    color: var(--text); font-size: 14px; font-weight: 500;
  }
  .opt-btn.correct { border-color: var(--felt); background: rgba(72,160,108,0.14); color: var(--felt-bright); }
  .opt-btn.wrong { border-color: var(--red); background: rgba(180,82,58,0.14); color: var(--red-bright); }
  .opt-btn:disabled { opacity: .75; }
  .explain-box {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 15px; margin-top: 8px; font-size: 13.5px;
    color: var(--text-dim); line-height: 1.55;
  }
  .next-btn {
    margin-top: 16px; width: 100%; background: var(--gold); color: #211705;
    border: none; border-radius: var(--radius-pill); padding: 14px; font-weight: 700; font-size: 14.5px;
  }
  .round-summary { text-align: center; padding: 20px 0 6px; }
  .round-summary .score { font-family: 'Fraunces', serif; font-size: 42px; color: var(--gold-bright); }
  .round-summary .of { color: var(--text-faint); font-size: 14px; margin-top: -2px; }
  .round-summary .msg { color: var(--text-dim); font-size: 14px; margin: 14px 0 6px; }
  .round-summary .mix { color: var(--text-faint); font-size: 12px; margin-bottom: 18px; }

  /* ---------- Log ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; color: var(--text-faint); font-weight: 600; }
  .field input, .field select, .field textarea {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 11px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .submit-btn {
    margin-top: 4px; width: 100%; background: var(--felt); color: #F4FBF6;
    border: none; border-radius: var(--radius-pill); padding: 13px; font-weight: 600; font-size: 14px;
  }
  .submit-btn.gold { background: var(--gold); color: #211705; }
  .summary-strip { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .session-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 13px 14px;
  }
  .session-item .mode-badge {
    width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; font-weight: 700;
  }
  .session-item .mode-badge.cash { background: rgba(72,160,108,0.18); color: var(--felt-bright); }
  .session-item .mode-badge.mtt { background: rgba(201,162,75,0.18); color: var(--gold-bright); }
  .session-item .info { flex: 1; min-width: 0; }
  .session-item .date { font-size: 12px; color: var(--text-faint); }
  .session-item .note { font-size: 12px; color: var(--text-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .profit { font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .session-item .profit.pos { color: var(--felt-bright); }
  .session-item .profit.neg { color: var(--red-bright); }
  .del-btn { background: none; border: none; color: var(--text-faint); font-size: 16px; padding: 4px 2px; }

  .note-item {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .note-item .txt { flex: 1; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .note-item .date { font-size: 10.5px; color: var(--text-faint); margin-bottom: 3px; }

  .empty-state { text-align: center; padding: 34px 10px; color: var(--text-faint); }
  .empty-state .ic { font-size: 30px; margin-bottom: 10px; opacity: .6; }
  .empty-state p { font-size: 13.5px; line-height: 1.5; }

  svg.spark { width: 100%; height: 56px; display: block; }

  /* ---------- Hands trainer ---------- */
  .hand-card { padding-bottom: 20px; }
  .board-row { display: flex; justify-content: center; gap: 10px; margin: 4px 0 12px; }
  .icm-rows { display:flex; flex-direction:column; gap:7px; margin:12px 0; }
  .icm-row { display:grid; grid-template-columns:112px minmax(0,1fr) 46px; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); }
  .icm-row .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icm-row .bar { height:9px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
  .icm-row .bar i { display:block; height:100%; border-radius:5px; background:var(--text-faint); }
  .icm-row .v { text-align:right; font-variant-numeric:tabular-nums; }
  .icm-row.me { color:var(--text); font-weight:700; } .icm-row.me .bar i { background:var(--gold); }
  .icm-row.villain { color:var(--text); } .icm-row.villain .bar i { background:var(--red-bright); }
  .pl-item { background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .pl-top { display:flex; align-items:center; gap:8px; width:100%; min-width:0; }
  .pl-top b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .pl-type { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface-3); color:var(--gold-bright); white-space:nowrap; }
  .pl-note { font-size:12.5px; color:var(--text-dim); line-height:1.45; }
  .br-line { margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); font-size:13px; line-height:1.45; }
  .br-line b { font-size:20px; margin-right:4px; } .br-line span { color:var(--text-dim); display:block; margin-top:2px; }
  .br-line.good { border-color:var(--felt-bright); } .br-line.mid { border-color:var(--gold); } .br-line.bad { border-color:var(--red-bright); }

    // BASICS (universal — applies to cash and tournaments alike)
    {id:'b-1', mode:'both', tier:'basics', title:'Hand Rankings, Top to Bottom', teaser:'The order every decision is built on',

    {id:'b-2', mode:'both', tier:'basics', title:'The Deal & Blinds', teaser:'Who posts what, and who gets cards',
      body:[
        "Every player gets two private 'hole' cards. The dealer button marks who deals (rotates each hand); the two players to its left post the small blind and big blind — forced bets that get the pot started.",

    {id:'b-3', mode:'both', tier:'basics', title:'Betting Rounds & Actions', teaser:'Preflop, flop, turn, river, showdown',

      takeaway:"Five words cover every decision you'll ever make: fold, check, call, bet, raise."},
    {id:'b-4', mode:'both', tier:'basics', title:'Reading the Board', teaser:'Building your best 5-card hand',
      body:[
        "By the river there are 5 community cards on the board, shared by everyone. Your final hand is the best 5-card combination you can make from your 2 hole cards plus those 5 — you can use both hole cards, one, or even neither.",

      takeaway:"Your hand is the best 5 of 7 cards available to you — not just what's in your own two hole cards."},
    {id:'b-5', mode:'both', tier:'basics', title:'Equity & Odds, the Basic Idea', teaser:'What "equity" actually means',
      body:[
        "Equity is your share of the pot based on your chance to win right now if no more betting happened. A coin-flip hand like AK vs. QQ preflop runs close to 50/50 equity for each side.",
        "You don't need exact math to start — just the habit of asking 'roughly how far ahead or behind am I here?' before you act."
      ],
      takeaway:"Equity is just your rough % chance to win the hand as it stands — everything else builds on this idea."},

    // CASH / EASY
    {id:'c-e-1', mode:'cash', tier:'easy', title:'Hand Strength & Starting Groups', teaser:'What makes a hand worth playing',
      body:[
        "Every starting hand falls somewhere between premium (AA, KK, AK) and trash (72o). Before you worry about anything fancier, get comfortable sorting hands into rough groups: premium pairs, strong aces/broadways, speculative suited hands, and everything else.",
        "A simple tight-aggressive starting point: play your strongest 15-20% of hands, raise when you enter a pot, and avoid limping in. This alone puts you ahead of most recreational players."
      ],
      takeaway:"When in doubt, fold the bottom of your range and raise the top of it — don't limp."},
    {id:'c-e-2', mode:'cash', tier:'easy', title:'Position Is Power', teaser:'Why your seat matters more than your cards',
      body:[
        "Acting last is a huge advantage — you see what everyone else does before you decide. That's why the same hand (say KJo) is a clear fold under the gun but a clear raise on the button.",
        "Think of the table in three zones: early (UTG, UTG+1) play tight, middle (MP, HJ) open up slightly, late (CO, BTN) play the widest range you have all night."

    {id:'c-e-3', mode:'cash', tier:'easy', title:'Pot Odds & Outs', teaser:'The only math you actually need',
      body:[
        "An 'out' is any card that turns your hand into a likely winner. A flush draw has 9 outs, an open-ended straight draw has 8. Multiply your outs by 4 (with two cards to come) or by 2 (with one card to come) to estimate your percent chance to hit.",
        "Compare that percentage to the price you're getting: if the pot offers better odds than your chance to hit, calling is usually correct."

    {id:'c-e-4', mode:'cash', tier:'easy', title:"Cash Isn't a Tournament", teaser:'Why tournament habits cost you at the cash table',

      takeaway:"Against loose callers, value bet more and bluff less. Fancy bluffs are for tough opponents."},
    // CASH / ADVANCED
    {id:'c-a-1', mode:'cash', tier:'advanced', title:'Opening Ranges by Position', teaser:'How wide should you raise first-in?',

    {id:'c-a-2', mode:'cash', tier:'advanced', title:'3-Betting Fundamentals', teaser:'Re-raising for value and as a bluff',
      body:[

    {id:'c-a-3', mode:'cash', tier:'advanced', title:'C-Betting & Board Texture', teaser:'When to keep firing after the raise',
      body:[
        "A continuation bet fires again after you raised preflop. Dry, high-card boards (K72 rainbow) favor the preflop raiser's range, so c-bet often and small. Wet, coordinated boards (JT9) hit callers' ranges harder, so bet less often and bigger when you do.",

    {id:'c-a-4', mode:'cash', tier:'advanced', title:'Bet Bigger Against Callers', teaser:'Sizing for value when opponents call too much',

    {id:'c-a-5', mode:'cash', tier:'advanced', title:'Deep Stacks and Passive Players', teaser:'Playing 100bb and beyond',

    // CASH / PRO
    {id:'c-p-1', mode:'cash', tier:'pro', title:'Balanced Ranges & Frequencies', teaser:'Why unexploitable play matters',

    {id:'c-p-2', mode:'cash', tier:'pro', title:'Exploitative Adjustments', teaser:'Deviating on purpose against weaker players',

  var QUIZ = [

  /* ============================= RANGE MATH ============================= */
  // 13x13 grid support: rank strength via the Chen Formula (a well-known, published
  // heuristic for ranking starting hands — not a solver output, but a defensible,
  // consistent approximation appropriate for a training tool).

  var RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
  var RANK_VAL = {A:14,K:13,Q:12,J:11,T:10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};

  function chenBase(v){
    if (v===14) return 10;
    if (v===13) return 8;
    if (v===12) return 7;
    if (v===11) return 6;
    if (v===10) return 5;
    return v/2;
  }
  function chenScore(v1, v2, suited){
    var hi = Math.max(v1,v2), lo = Math.min(v1,v2);
    if (v1===v2) return Math.max(chenBase(hi)*2, 5);
    var score = chenBase(hi);
    if (suited) score += 2;
    var gap = hi - lo - 1;
    if (gap===1) score -= 1;
    else if (gap===2) score -= 2;
    else if (gap===3) score -= 4;
    else if (gap>=4) score -= 5;
    if ((gap===0 || gap===1) && hi<=11) score += 1;
    return score;
  }

  var RANKED_HANDS = null; // built once, cached
  function buildRankedHands(){
    if (RANKED_HANDS) return RANKED_HANDS;
    var list = [];
    for (var i=0;i<13;i++){
      for (var j=i;j<13;j++){
        var v1 = RANK_VAL[RANKS[i]], v2 = RANK_VAL[RANKS[j]];
        if (i===j){
          list.push({key:RANKS[i]+RANKS[i], combos:6, score:chenScore(v1,v2,false)});
        } else {
          list.push({key:RANKS[i]+RANKS[j]+'s', combos:4, score:chenScore(v1,v2,true)});
          list.push({key:RANKS[j]+RANKS[i]+'o', combos:12, score:chenScore(v1,v2,false)});
        }
      }
    }
    list.sort(function(a,b){ return b.score - a.score; });
    RANKED_HANDS = list;
    return list;
  }

  function includedSetForPercent(pct){
    var list = buildRankedHands();
    var totalCombos = 1326;
    var target = totalCombos * (pct/100);
    var cum = 0;
    var included = {};
    for (var i=0;i<list.length;i++){
      if (cum >= target) break;
      included[list[i].key] = true;
      cum += list[i].combos;
    }
    return included;
  }

  function parsePercent(str){
    var m = str.match(/(\d+(?:\.\d+)?)/g);
    if (!m) return null;
    if (m.length>=2) return (parseFloat(m[0])+parseFloat(m[1]))/2;
    return parseFloat(m[0]);
  }

  function rangeGridHtml(includedMap, pct){
    var html = '<div class="grid-wrap"><table class="rgrid"><tbody>';
    for (var i=0;i<13;i++){
      html += '<tr>';
      for (var j=0;j<13;j++){
        var key, cls;
        if (i===j){ key = RANKS[i]+RANKS[i]; cls = 'pairin'; }
        else if (i<j){ key = RANKS[i]+RANKS[j]+'s'; cls='in'; }
        else { key = RANKS[j]+RANKS[i]+'o'; cls='in'; }
        var included = includedMap[key];
        html += '<td class="'+(included?cls:'')+'">'+key+'</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    html += '<div class="grid-legend"><span><span class="sw" style="background:var(--gold)"></span>In range</span><span><span class="sw" style="background:var(--felt)"></span>Pair, in range</span></div>';
    if (typeof pct === 'number') html += '<div class="chart-note">Highlighting the top ~'+Math.round(pct)+'% of hands by weighted combos (Chen formula ranking — a heuristic, not a solved table).</div>';
    return html;
  }

  function stackToBtnPercent(stack){
    var anchors = [[4,68],[6,58],[8,50],[10,44],[12,38],[15,32],[20,22],[25,16],[30,12]];
    if (stack<=anchors[0][0]) return anchors[0][1];
    if (stack>=anchors[anchors.length-1][0]) return anchors[anchors.length-1][1];
    for (var i=0;i<anchors.length-1;i++){
      var a=anchors[i], b=anchors[i+1];
      if (stack>=a[0] && stack<=b[0]){
        var t = (stack-a[0])/(b[0]-a[0]);
        return a[1] + t*(b[1]-a[1]);
      }
    }

    suitedGapper:'suited cards keep some flush and straight potential',

  };
  var WEAK = {

    suitedAce:'low suited aces are better saved for later seats',
    suitedBroadway:'it is playable but not strong enough here',
    suitedConnector:'connected cards need position to make money',
    suitedGapper:'gapped suited cards need position and a cheap price',
    offAce:'an ace with a weak kicker gets dominated when called',
    offBroadway:'offsuit big cards get dominated by better ones',

    var g = GROUP[k] || 'BB';
    if (g==='EP') return 'many players still act behind you and one of them often holds a better hand';
    if (g==='MP') return 'several players behind you can still wake up with a strong hand';
    if (g==='LP') return 'you are close to the button, so you can open wider, but not with everything';
    if (g==='BTN') return 'you act last after the flop, so you can open very wide, but not with everything';

  function fmt(n){ return (Math.round(n*10)/10).toString(); }
  function pctStr(p){ return p>=10 ? Math.round(p)+'%' : (Math.round(p*10)/10)+'%'; }

  function explain(scn, R, j, a){
    var h = scn.hand, c = catOf(h), hero = scn.hero.l, v = scn.villain ? scn.villain.l : '';
    var out = '', p, best = j.best, margTxt = '';
    if (!best){
      var m = actLabel(scn, R.margAction).toLowerCase();

        var eq = DATA.eq[R.meta.eqRow][RANK_IDX[h]]/10;
        return 'This one is close. '+h+' has about '+Math.round(eq)+'% against a '+Math.round(R.meta.villPct)+'% shoving range and you need about '+Math.round(R.meta.thr*100)+'%. Calling or folding is fine.';
      }
      return 'Borderline. '+h+' is close to the edge of this range, so '+m+' and fold are both fine here. A better table read decides it: lean '+m+' against weak players and fold against tough ones.';
    }
    if (scn.type==='rfi'){
      p = pctOf(R.sets.raise);
      if (best==='raise') out = h+' is a standard open from the '+hero+' (about '+pctStr(p)+' of hands): '+PLAY[c]+'.';
      else out = h+' is a fold from the '+hero+': '+seatReason(scn.hero.k)+', and '+WEAK[c]+'. Opening range here is about '+pctStr(p)+' of hands.';
    } else if (scn.type==='pushfold'){
      p = R.meta.pct;
      if (best==='raise') out = 'At '+scn.stack+'bb from the '+hero+', shoving about '+Math.round(p)+'% of hands is standard. '+h+' is well inside that range, so it has enough equity and makes the blinds fold often.';
      else out = h+' is outside the roughly '+Math.round(p)+'% shoving range from the '+hero+' at '+scn.stack+'bb. You would risk your whole stack with too little equity when someone calls.';
    } else if (scn.type==='vsopen'){
      var op = RFI[scn.villain.k] ? pctOf(parse(RFI[scn.villain.k].open)) : 0;
      if (best==='raise'){

                        : ('3-bet as a bluff: '+h+' blocks strong hands and still has real equity if '+v+' calls.');
      } else if (best==='call'){
        out = h+' is good enough to call against '+v+'’s opening range (about '+pctStr(op)+' of hands): '+PLAY[c]+'.'+((scn.hero.k==='BB')?' Closing the action with a discount also helps.':'');

  function tierBlurb(tier, mode){
    var m = mode==='cash' ? 'cash game' : 'tournament';
    if (tier==='basics') return "Absolute fundamentals — hand rankings, how a hand plays out, and the vocabulary everything else is built on. These apply the same whether you're playing cash or tournaments.";
    if (tier==='easy') return "Foundations: hand strength, position, and the basic math you need before anything else clicks in "+m+" play.";
    if (tier==='advanced') return "Building blocks: opening ranges, 3-betting, continuation betting, and stack-depth strategy for "+m+" play.";
    return "High-level concepts: balance, exploitation, and ICM-aware thinking for serious "+m+" play.";
  }

  function pushFoldCalculatorHtml(){
    var html = '<div class="card pf-card">';
    html += '<h3 style="font-size:16.5px; margin-bottom:4px;">Push/fold helper</h3>';
    html += '<p style="font-size:12.5px; color:var(--text-faint); margin-bottom:14px;">Type in a stack size and position to see an approximate shoving range.</p>';

  function wirePushFold(main){
    var btn = document.getElementById('pfCalcBtn');
    if (!btn) return;
    btn.addEventListener('click', function(){
      var stackInput = document.getElementById('pfStack');
      var posSelect = document.getElementById('pfPos');
      var stack = Math.max(1, Math.min(40, parseFloat(stackInput.value) || 10));
      var pos = posSelect.value;
      pfState.stack = stack;
      pfState.pos = pos;
      if (stack > 30) {
        pfState.result = null;
        renderCharts(main);
        return;
      }
      var btnPct = stackToBtnPercent(stack);
      var pct = Math.max(2, Math.min(100, btnPct * (POS_MULT[pos]||1)));
      pfState.result = pct;
      renderCharts(main);
    });
  }

  /* ============================= DRILLS ============================= */

  function startRound(){
    var pool = byTierMode(QUIZ, state.tier, state.mode).slice();
    var due = shuffle(pool.filter(function(q){ var p=state.progressQ[q.id]; return !p || p.streak<2; }));
    var rest = shuffle(pool.slice());
    var picked = [];
    due.forEach(function(q){ if (picked.length<5 && picked.indexOf(q)===-1) picked.push(q); });
    rest.forEach(function(q){ if (picked.length<5 && picked.indexOf(q)===-1) picked.push(q); });
    var reviewCount = picked.filter(function(q){ return !!state.progressQ[q.id]; }).length;
    state.quizRound = { qIds: picked.map(function(q){return q.id;}), idx:0, answers:[], selected:null, reviewCount:reviewCount, newCount: picked.length-reviewCount };
    saveState();
  }

  function renderDrills(main){
    if (!state.quizRound) startRound();
    var round = state.quizRound;
    if (round.idx >= round.qIds.length) { renderRoundSummary(main); return; }

    var q = QUIZ.filter(function(x){return x.id===round.qIds[round.idx];})[0];
    var isReview = !!state.progressQ[q.id];
    var html = '';
    html += '<div class="quiz-progress">';
    round.qIds.forEach(function(id, i){
      var cls = 'dot';
      if (i < round.answers.length) cls += round.answers[i].correct ? ' right' : ' wrong';
      else if (i === round.idx) cls += ' on';
      html += '<span class="'+cls+'"></span>';
    });
    html += '</div>';
    if (isReview) html += '<div class="review-tag"><span class="pill gold">&#8635; Review</span></div>';
    html += '<div class="card">';
    if (q.type==='compare') {
      html += '<div class="q-text">Which hand wins?</div>';
      html += '<div class="compare-wrap">' +
        '<div class="hand-box"><div class="lbl">Hand A</div><div class="name">'+esc(q.handA.name)+'</div><div class="cards">'+esc(q.handA.cards)+'</div></div>' +
        '<div class="hand-box"><div class="lbl">Hand B</div><div class="name">'+esc(q.handB.name)+'</div><div class="cards">'+esc(q.handB.cards)+'</div></div>' +
        '</div>';
    } else {
      html += '<div class="q-text">'+esc(q.q)+'</div>';
    }
    html += '<div id="optsWrap">';
    q.opts.forEach(function(opt, i){
      html += '<button class="opt-btn" data-i="'+i+'">'+esc(opt)+'</button>';
    });
    html += '</div>';
    html += '<div id="explainWrap"></div>';
    html += '</div>';
    main.innerHTML = html;

    Array.prototype.forEach.call(main.querySelectorAll('.opt-btn'), function(btn){
      btn.addEventListener('click', function(){ answerQuestion(main, q, parseInt(btn.getAttribute('data-i'),10)); });
    });
  }

  function answerQuestion(main, q, choice){
    var round = state.quizRound;
    if (round.selected !== null) return;
    round.selected = choice;
    var correct = choice === q.correct;
    round.answers.push({id:q.id, correct:correct});

    var key = state.tier==='basics' ? 'basics' : (state.tier+'_'+state.mode);
    if (!state.quizStats[key]) state.quizStats[key] = {correct:0,total:0};
    state.quizStats[key].total += 1;
    if (correct) state.quizStats[key].correct += 1;

    var qp = state.progressQ[q.id] || {streak:0, misses:0};
    if (correct) qp.streak = Math.min(2, qp.streak+1);
    else { qp.streak = 0; qp.misses = (qp.misses||0)+1; }
    state.progressQ[q.id] = qp;

    saveState();

    Array.prototype.forEach.call(main.querySelectorAll('.opt-btn'), function(btn, i){
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      else if (i === choice) btn.classList.add('wrong');
    });

    var explainWrap = document.getElementById('explainWrap');
    explainWrap.innerHTML = '<div class="explain-box">'+esc(q.explain)+'</div>' +
      '<button class="next-btn" id="nextBtn">'+(round.idx+1 < round.qIds.length ? 'Next question' : 'See results')+'</button>';
    document.getElementById('nextBtn').addEventListener('click', function(){
      round.idx += 1; round.selected = null; saveState(); renderDrills(main);
    });
  }

  function renderRoundSummary(main){
    var round = state.quizRound;
    var score = round.answers.filter(function(a){return a.correct;}).length;
    var total = round.answers.length;
    var msg = score===total ? "Clean sweep — nice work." : score >= Math.ceil(total*0.6) ? "Solid round. Review anything you missed in Learn." : "Good rep — revisit the related lessons and try again.";
    var mixParts = [];
    if (round.newCount) mixParts.push(round.newCount+' new');
    if (round.reviewCount) mixParts.push(round.reviewCount+' review');
    var html = '<div class="card round-summary">' +
      '<div class="score">'+score+'<span style="font-size:22px;color:var(--text-faint);">/'+total+'</span></div>' +
      '<div class="of">'+esc(state.tier==='basics' ? 'Basics' : (tierLabel(state.tier)+' · '+modeLabel(state.mode)))+'</div>' +
      '<div class="msg">'+esc(msg)+'</div>' +
      (mixParts.length ? '<div class="mix">'+mixParts.join(' · ')+'</div>' : '') +
      '<button class="next-btn" id="againBtn">Another round</button>' +
      '</div>';
    main.innerHTML = html;
    document.getElementById('againBtn').addEventListener('click', function(){
      state.quizRound = null; saveState(); renderDrills(main);
    });
  }

  /* ============================= HANDS TRAINER ============================= */

  var hs = { round:null, tableMsg:'', kind:'pre', opp:'mixed', street:'mixed', icm:{preset:'mixed', custom:''}, msg:'' };
  var SUIT_SYM = {s:'♠', h:'♥', d:'♦', c:'♣'};

  function cardHtml(c){
    var red = (c.s==='h' || c.s==='d');
    return '<div class="pcard'+(red?' red':'')+'"><span class="r">'+(c.r==='T'?'10':c.r)+'</span><span class="s">'+SUIT_SYM[c.s]+'</span></div>';
  }
  var ZONES = {UTG:'Early', UTG1:'Early', MP:'Middle', LJ:'Middle', HJ:'Middle', CO:'Late', BTN:'Late', SB:'Blinds', BB:'Blinds'};
  function handTierId(){ return state.tier==='basics' ? 'easy' : state.tier; }
  function handKey(scn){ return scn.mode+':'+handTierId()+':'+scn.type+':'+scn.hero.k; }

  function tableHtml(scn, v){
    var n = v.seats.length, hi = scn.hero.i, html = '<div class="ptable"><div class="pfelt"><div class="ppot">Pot '+(Math.round(v.pot*10)/10)+'bb</div></div>';
    v.seats.forEach(function(s, i){
      var ang = (90 + (i-hi)*360/n) * Math.PI/180;
      var x = 50 + 43*Math.cos(ang), y = 50 + 41*Math.sin(ang);
      html += '<div class="pseat '+s.state+'" style="left:'+x.toFixed(1)+'%;top:'+y.toFixed(1)+'%">' +
        '<span class="sl">'+esc(s.l)+'</span>' + (s.k==='BTN' ? '<i class="dbtn">D</i>' : '') +
        '<span class="st">'+esc(s.text)+'</span></div>';
    });
    return html + '</div>';
  }

  function handGridHtml(R, hand){
    var html = '<div class="grid-wrap"><table class="rgrid hg"><tbody>';
    for (var i=0;i<13;i++){
      html += '<tr>';
      for (var j=0;j<13;j++){
        var key;
        if (i===j) key = RANKS[i]+RANKS[i];
        else if (i<j) key = RANKS[i]+RANKS[j]+'s';
        else key = RANKS[j]+RANKS[i]+'o';
        var cls = R.sets.raise[key] ? 'hr' : R.sets.call[key] ? 'hc' : R.sets.marg[key] ? 'hm' : '';
        if (key===hand) cls += ' me';
        html += '<td class="'+cls+'">'+key+'</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div><div class="grid-legend">';
    html += '<span><span class="sw" style="background:var(--gold)"></span>'+esc(R.labels.raise)+'</span>';
    if (R.actions.indexOf('call')>=0) html += '<span><span class="sw" style="background:var(--felt)"></span>Call</span>';
    html += '<span><span class="sw" style="background:var(--surface-3);outline:1px solid var(--gold)"></span>Borderline</span></div>';
    return html;
  }

  function scnGroup(s){ return s.kind==='flop' ? 'flop' : s.kind==='icm' ? 'icm' : 'pre'; }
  function typeGroup(t){ return /^(fl|tr|rv)_/.test(t) ? 'flop' : /^icm_/.test(t) ? 'icm' : 'pre'; }
  function pickStreet(tier, forceMixed){
    if (tier==='easy') return 'flop';
    var s = forceMixed ? 'mixed' : (hs.street||'mixed');
    if (s!=='mixed') return s;
    var r = Math.random();
    if (tier==='advanced') return r<0.5 ? 'flop' : 'turn';
    return r<0.34 ? 'flop' : r<0.67 ? 'turn' : 'river';
  }
  function icmOpts(tier){
    var o = {tier:tier}, p = hs.icm||{};
    if (p.preset && p.preset!=='mixed' && p.preset!=='custom') o.preset = p.preset;
    if (p.preset==='custom'){
      var nums = String(p.custom||'').split(/[^0-9.]+/).map(parseFloat).filter(function(x){ return x>0; }).slice(0,6);
      if (nums.length>=2){
        var sum = nums.reduce(function(x,y){ return x+y; },0);
        o.pays = nums.map(function(x){ return Math.round(x*1000/sum)/10; });
        o.players = Math.min(7, Math.max(3, nums.length+1));
      }
    }
    return o;
  }
  function weakestOpp(){
    var by = {};
    Object.keys(state.handStats||{}).forEach(function(k){
      var p = k.split(':'); if (p[0]!==state.mode || p[2].indexOf('flopp_')!==0) return;
      var c = p[2].slice(6), o = by[c] || (by[c] = {c:0,t:0}); o.c += state.handStats[k].c; o.t += state.handStats[k].t;
    });
    var w = null;
    ['passive','tight','maniac'].forEach(function(c){ var o = by[c]; if (o && o.t>=3){ var ac = o.c/o.t; if (!w || ac < w.a) w = {k:c, a:ac}; } });
    return w ? w.k : (handTierId()==='easy' ? 'passive' : 'mixed');
  }
  function dailyList(){
    var tier = handTierId(), mode = state.mode, list = [], seen = {}, i, g;
    function add(s){ var sg = HandsEngine.sig(s); if (seen[sg]) return false; seen[sg] = 1; list.push(s); return true; }
    var rv = (state.handReview||[]).filter(function(r){ return r.scn && r.scn.mode===mode; }).slice(0,3);
    rv.forEach(function(r){ add(r.scn); });
    var nSpecial = 3, drill = null;
    try { var lk = focusLeaks(); if (lk.length && lk[0].drill) drill = lk[0].drill; } catch(e) {}
    if (!drill) drill = {type:'rfi', seats:['UTG']};
    for (i=0, g=0; i<nSpecial && g<200; g++){
      var sp;
      try {
        sp = mode==='mtt' ? IcmEngine.build(icmOpts(tier)) : FlopEngine.build({mode:mode, tier:tier, opp:weakestOpp(), street:pickStreet(tier, true)});
      } catch(e) { break; }
      if (add(sp)) i++;
    }
    g = 0;
    while (list.length < 10 && g++ < 300){
      var pc;
      try { pc = (g%4===0) ? HandsEngine.buildScenario({mode:mode, tier:tier, table:state.tableSize||9}) : HandsEngine.buildFor({mode:mode, tier:tier, type:drill.type, seats:drill.seats}); }
      catch(e) { pc = HandsEngine.buildScenario({mode:mode, tier:tier, table:state.tableSize||9}); }
      add(pc);
    }
    for (i=list.length-1;i>0;i--){ var j2 = (Math.random()*(i+1))|0, t2 = list[i]; list[i] = list[j2]; list[j2] = t2; }
    return list.slice(0,10);
  }

  function startHandRound(reviewMode, target){
    var tier = handTierId(), list = [];
    var opts = {mode:state.mode, tier:tier, table:state.tableSize||9};
    if (target && target.daily){
      list = dailyList(); reviewMode = false;
    } else {
      if (reviewMode){
        list = (state.handReview||[]).filter(function(r){ return r.scn && r.scn.mode===state.mode && scnGroup(r.scn)===hs.kind; }).slice(0,10).map(function(r){ return r.scn; });
        if (!list.length){ reviewMode = false; }
      }
      if (target){
        var seenT = {}, gt = 0;
        while (list.length < 10 && gt++ < 300){
          var st = HandsEngine.buildFor({mode:state.mode, tier:tier, type:target.type, seats:target.seats}), sgt = HandsEngine.sig(st);
          if (seenT[sgt]) continue;
          seenT[sgt] = 1; list.push(st);
        }
      } else if (!reviewMode){
        var seen = {};
        var guard = 0;
        while (list.length < 10 && guard++ < 300){
          var s = hs.kind==='flop' ? FlopEngine.build({mode:state.mode, tier:tier, opp:hs.opp, street:pickStreet(tier)})
                : hs.kind==='icm' ? IcmEngine.build(icmOpts(tier))
                : HandsEngine.buildScenario(opts), sg = HandsEngine.sig(s);
          if (seen[sg]) continue;
          seen[sg] = 1; list.push(s);
        }
      }
    }
    hs.round = { list:list, idx:0, results:[], answered:null, review:!!reviewMode, tier:tier, target:target||null };
  }

  function recordHand(scn, verdict, review){
    var key = handKey(scn);
    var st = state.handStats[key] || {c:0, t:0};
    st.t += 1; if (verdict!=='wrong') st.c += 1;
    state.handStats[key] = st;
    if (scn.kind==='flop'){
      var ck = scn.mode+':'+handTierId()+':flcls_'+scn.cls+':FLOP', cs2 = state.handStats[ck] || {c:0,t:0};

      os2.t += 1; if (verdict!=='wrong') os2.c += 1; state.handStats[ok2] = os2;
    }
    var sg = HandsEngine.sig(scn);
    var rv = (state.handReview||[]).filter(function(r){ return r.id!==sg; });
    if (verdict==='wrong'){
      rv.unshift({id:sg, scn:scn, t:Date.now()});

  function seatReport(){
    var by = {}, mode = state.mode;
    Object.keys(state.handStats||{}).forEach(function(k){
      var p = k.split(':');
      if (p[0]!==mode || p[3]==='FLOP' || p[3]==='ICM') return;
      var seat = p[3], o = by[seat] || (by[seat] = {c:0,t:0});
      o.c += state.handStats[k].c; o.t += state.handStats[k].t;
    });
    return by;
  }
  function typeReport(group){
    if (group===true) group = 'flop'; if (!group) group = 'pre';
    var by = {}, mode = state.mode;
    Object.keys(state.handStats||{}).forEach(function(k){
      var p = k.split(':');
      if (p[0]!==mode || p[2].indexOf('flcls_')===0 || p[2].indexOf('flopp_')===0) return;
      if (typeGroup(p[2])!==group) return;
      var o = by[p[2]] || (by[p[2]] = {c:0,t:0});
      o.c += state.handStats[k].c; o.t += state.handStats[k].t;
    });
    return by;
  }

  function handsInsight(){
    var by = seatReport(), worst = null;
    Object.keys(by).forEach(function(k){
      if (by[k].t >= 6){
        var a = by[k].c/by[k].t;
        if (!worst || a < worst.a) worst = {k:k, a:a, t:by[k].t};
      }
    });
    if (worst && worst.a < 0.8){
      var T = HandsEngine.TABLES[9], lbl = worst.k;
      T.forEach(function(s){ if (s.k===worst.k) lbl = s.l; });
      return 'Your toughest seat in the hand trainer is the '+lbl+' at '+Math.round(worst.a*100)+'% ('+worst.t+' hands) — spend a round there.';
    }
    return null;
  }

  /* ============================= PRE-SESSION FOCUS ============================= */

  var fv = { open:false, energy:null, mood:null, buyin:100, stop:100, minutes:120, plan:null };

  function focusLeaks(){
    var out = [], by = {}, mode = state.mode, T = HandsEngine.TABLES[9];
    function seatLabel(k){ var l = k; T.forEach(function(s){ if (s.k===k) l = s.l; }); return l; }
    Object.keys(state.handStats||{}).forEach(function(k){
      var p = k.split(':'); if (p[0]!==mode || p[3]==='FLOP' || p[3]==='ICM') return;
      var id = p[2]+':'+p[3], o = by[id] || (by[id] = {type:p[2], seat:p[3], c:0, t:0});
      o.c += state.handStats[k].c; o.t += state.handStats[k].t;
    });
    var arr = Object.keys(by).map(function(k){ return by[k]; }).filter(function(o){ return o.t>=5 && o.c/o.t < 0.8; });
    arr.sort(function(a,b){ return a.c/a.t - b.c/b.t; });
    arr.forEach(function(o){
      if (out.length>=2) return;
      var s = seatLabel(o.seat), a = Math.round(100*o.c/o.t), rule;
      if (o.type==='rfi'){
        var d = HandsEngine.RFI[o.seat];
        var n = d ? Math.round(HandsEngine.pctOf(HandsEngine.parse(d.open))) : null;
        rule = 'Opening from the '+s+(n ? ': stick to about '+n+'% of hands and fold the rest.' : ': fold the weak ones.');
      } else if (o.type==='vsopen') rule = 'Facing a raise in the '+s+': 3-bet strong hands, call playable ones, fold the rest. A cheap price is not a reason to call.';
      else if (o.type==='vs3bet') rule = 'When you open and get 3-bet from the '+s+': continue only with strong hands (JJ+, AQs+, AK). Folding is fine.';
      else if (o.type==='pushfold') rule = 'Short stack in the '+s+': shove or fold. Tighter from early seats, wider late.';
      else rule = 'Before calling a shove, check the price. If the pot odds say fold, fold, especially near the bubble.';
      out.push({title:TYPE_DESC[o.type]+' · '+s, sub:'Your hand-trainer accuracy: '+a+'% ('+o.t+' hands)', rule:rule, drill:{type:o.type, seats:[o.seat]}});
    });
    if (out.length<2){
      var tags = {};
      state.sessions.forEach(function(x){ if (x.tag) tags[x.tag] = (tags[x.tag]||0)+1; });
      var top = Object.keys(tags).sort(function(a,b){ return tags[b]-tags[a]; })[0];
      var tr = {tilt:'If you feel tilted, take a 10 minute walk before the next hand. No rebuy while tilted.', range:'Play fewer hands. If unsure, fold.', sizing:'Pick one standard raise size and use it every time.', icm:'Near the money, skip close calls and avoid coin-flips for your whole stack.', other:'Pause and think before any big decision.'};
      if (top && tr[top]) out.push({title:tagLabel(top), sub:'Your most common logged leak ('+tags[top]+' sessions)', rule:tr[top], drill:(top==='range' ? {type:'rfi', seats:null} : (top==='icm' && mode==='mtt' ? {type:'vsshove', seats:null} : null))});
    }
    var defs = [
      {title:'Position discipline', sub:'Default focus', rule:'Early seats get the tightest range. Fold marginal hands up front and open wider on the button.', drill:{type:'rfi', seats:['UTG','UTG1','MP']}},
      {title:'Raise or fold', sub:'Default focus', rule:'Do not limp. If a hand is worth playing, raise. If not, fold.', drill:{type:'rfi', seats:null}}
    ];
    var i = 0; while (out.length<2) out.push(defs[i++]);
    return out;
  }

  function adherenceLine(){
    var done = (state.focusLog||[]).filter(function(p){ return p.stuck===true || p.stuck===false; });
    if (done.length < 3) return null;
    var ok = done.filter(function(p){ return p.stuck; }).length;
    return 'You stuck to your session plan '+ok+' of '+done.length+' times — the plan only helps when you follow it.';
  }

    html += '<div class="section-title">4. Your three promises</div><div class="card"><div class="missed-list" style="margin:0">' +

    html += '<button class="next-btn" id="fvSave">I\'m ready — save my plan</button>';

    var plan = fv.plan || (state.focusLog||[]).filter(function(p){ return p.date===localISO(); })[0];

    html += '<div class="card">';
    html += '<p style="font-size:12.5px; color:var(--text-faint); margin-bottom:10px; line-height:1.5;">Can\'t use your phone at the table? Use the quick flag above, or type or dictate here between breaks (tap the microphone on your keyboard to talk instead of type). One hand per line.</p>';
    html += '<textarea id="bulkNotes" placeholder="CO AKs 3bet BB call, flop Kxx, won $85" style="width:100%; min-height:76px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 11px; color:var(--text); font-size:13.5px; font-family:inherit; resize:vertical;"></textarea>';
    html += '<button class="submit-btn gold" id="saveNotesBtn" style="margin-top:10px;">Save hand notes</button>';
    html += '</div>';

    if (notes.length) {
      html += '<div class="stack" style="margin-top:12px;">';
      notes.slice(0,8).forEach(function(n){
        html += '<div class="note-item"><div class="txt"><div class="date">'+fmtDate(n.date)+'</div>'+esc(n.text)+'</div><button class="del-btn" data-note-id="'+n.id+'">&#10005;</button></div>';
      });
      html += '</div>';
    }

    html += playersHtml();
    html += bankrollHtml();

    html += '<div class="section-title">Log a session</div>';
    html += '<div class="card">';
    html += '<div class="form-grid">';
    html += '<div class="field"><label>Date</label><input type="date" id="fDate" value="'+today+'"></div>';
    html += '<div class="field"><label>Game</label><select id="fMode"><option value="cash">Cash</option><option value="mtt">Tournament</option></select></div>';
    html += '<div class="field"><label>Buy-in ($)</label><input type="number" id="fBuyin" placeholder="0" min="0" step="1"></div>';
    html += '<div class="field"><label>Cash-out ($)</label><input type="number" id="fCashout" placeholder="0" min="0" step="1"></div>';
    html += '<div class="field"><label>Duration (min)</label><input type="number" id="fDuration" placeholder="0" min="0" step="1"></div>';
    html += '<div class="field"><label>Tag</label><select id="fTag"><option value="">No leak flagged</option><option value="tilt">Tilt / emotional</option><option value="range">Range too wide</option><option value="sizing">Bet sizing</option><option value="icm">ICM / bubble spot</option><option value="other">Other</option></select></div>';
    html += '<div class="field full"><label>Notes</label><textarea id="fNote" placeholder="What happened? Any hand to review?"></textarea></div>';
    html += '</div>';
    html += '<button class="submit-btn" id="addSessionBtn">Add session</button>';
    html += '</div>';

    if (total) {
      html += '<div class="section-title">Overview</div>';
      html += '<div class="summary-strip">' +
        '<div class="stat-box"><div class="num" style="color:'+(totalProfit>=0?'var(--felt-bright)':'var(--red-bright)')+'">'+fmtMoney(totalProfit)+'</div><div class="lbl">Net result</div></div>' +
        '<div class="stat-box"><div class="num">'+winRate+'%</div><div class="lbl">Winning sessions</div></div>' +
        '<div class="stat-box"><div class="num">'+total+'</div><div class="lbl">Sessions</div></div>' +
      '</div>';
      html += '<div class="card" style="margin-top:12px;">'+sparkline(state.sessions)+'</div>';
    }

    html += '<div class="section-title">History</div>';
    if (!sessions.length) {
      html += '<div class="empty-state"><div class="ic">&#128176;</div><p>No sessions logged yet. Add your first one above — even a quick note beats nothing.</p></div>';
    } else {
      html += '<div class="stack">';
      sessions.forEach(function(s){
        var profit = s.cashout - s.buyin;
        html += '<div class="session-item">' +
          '<span class="mode-badge '+s.mode+'">'+(s.mode==='cash'?'C':'T')+'</span>' +
          '<div class="info"><div class="date">'+fmtDate(s.date)+(s.tag?' · '+esc(tagLabel(s.tag)):'')+'</div>' +
          (s.note ? '<div class="note">'+esc(s.note)+'</div>' : '') + '</div>' +
          '<span class="profit '+(profit>=0?'pos':'neg')+'">'+fmtMoney(profit)+'</span>' +
          '<button class="del-btn" data-id="'+s.id+'">&#10005;</button>' +
          '</div>';
      });
      html += '</div>';
    }

    main.innerHTML = html;

    Array.prototype.forEach.call(main.querySelectorAll('#qfSeats .qf-chip'), function(b){
      b.addEventListener('click', function(){ var s = b.getAttribute('data-s'); qf.seat = (qf.seat===s ? null : s); qf.msg = ''; renderLog(main); });
    });
    Array.prototype.forEach.call(main.querySelectorAll('#qfTags .qf-chip'), function(b){
      b.addEventListener('click', function(){
        var t = b.getAttribute('data-t'), now = new Date();
        var text = (qf.seat ? qf.seat+' \u00b7 ' : '') + t + ' (' + hhmm(now) + ')';
        state.handNotes.push({ id:'h'+Date.now()+'_q', date:today, text:text });
        saveState();
        qf.msg = 'Flagged: '+text; qf.seat = null; renderLog(main);
      });
    });
    document.getElementById('saveNotesBtn').addEventListener('click', function(){
      var raw = document.getElementById('bulkNotes').value;
      var lines = raw.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
      if (!lines.length) return;
      lines.forEach(function(line, i){
        state.handNotes.push({ id: 'h'+Date.now()+'_'+i, date: today, text: line });
      });
      saveState(); renderLog(main);
    });

    wirePlayers(main);
    wireBankroll(main);

    document.getElementById('addSessionBtn').addEventListener('click', function(){
      var buyin = parseFloat(document.getElementById('fBuyin').value) || 0;
      var cashout = parseFloat(document.getElementById('fCashout').value) || 0;
      var date = document.getElementById('fDate').value || today;
      var mode = document.getElementById('fMode').value;
      var duration = parseFloat(document.getElementById('fDuration').value) || 0;
      var tag = document.getElementById('fTag').value;
      var note = document.getElementById('fNote').value.trim();
      state.sessions.push({ id: 's'+Date.now(), date:date, mode:mode, buyin:buyin, cashout:cashout, duration:duration, tag:tag, note:note });
      saveState(); renderLog(main);
    });

    Array.prototype.forEach.call(main.querySelectorAll('.del-btn[data-id]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        state.sessions = state.sessions.filter(function(s){ return s.id !== id; });
        saveState(); renderLog(main);
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll('.del-btn[data-note-id]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-note-id');
        state.handNotes = state.handNotes.filter(function(n){ return n.id !== id; });
        saveState(); renderLog(main);
      });
    });
  }

  var PL_TYPES = [['passive','Calls a lot'],['tight','Tight'],['maniac','Bets a lot'],['','Not sure']];
  function plTypeLabel(t){ var l = 'Not sure'; PL_TYPES.forEach(function(x){ if (x[0]===(t||'')) l = x[1]; }); return l; }
  var plDraft = {type:'passive', msg:''};
  function playersHtml(){
    var list = (state.players||[]).slice().sort(function(x,y){ return (y.t||0)-(x.t||0); });
    var h = '<div class="section-title">Players at your table</div><div class="card">';
    h += '<p style="font-size:12.5px;color:var(--text-faint);margin-bottom:10px;line-height:1.5">Name a player by seat or by what they wear, pick how they play, then practice against that type.</p>';
    h += '<div class="field" style="margin-bottom:10px"><label>Who</label><input type="text" id="plName" placeholder="Seat 4, red hat" maxlength="40"></div>';
    h += '<div class="field" style="margin-bottom:10px"><label>How they play</label><div class="view-toggle" id="plType" style="margin-bottom:0;flex-wrap:wrap">' + PL_TYPES.map(function(x){ return '<button data-t="'+x[0]+'" class="'+(plDraft.type===x[0]?'active':'')+'">'+x[1]+'</button>'; }).join('') + '</div></div>';
    h += '<div class="field" style="margin-bottom:10px"><label>Note (optional)</label><input type="text" id="plNote" placeholder="Folds to 3-bets, never bluffs" maxlength="90"></div>';
    h += '<button class="submit-btn gold" id="plAdd">Add player</button>';
    h += '<div id="plMsg" style="font-size:12.5px;color:var(--felt-bright);min-height:16px;margin-top:6px">'+esc(plDraft.msg)+'</div>';
    if (list.length){
      h += '<div class="stack" style="margin-top:6px">';
      list.forEach(function(p){
        h += '<div class="pl-item"><div class="pl-top"><b>'+esc(p.name)+'</b><span class="pl-type">'+esc(plTypeLabel(p.type))+'</span><button class="del-btn" data-pid="'+esc(p.id)+'">&#10005;</button></div>' +
          (p.notes ? '<div class="pl-note">'+esc(p.notes)+'</div>' : '') +
          (p.type ? '<button class="qf-chip tag" data-practice="'+esc(p.type)+'">Practice vs this type</button>' : '') + '</div>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }
  function wirePlayers(main){
    Array.prototype.forEach.call(main.querySelectorAll('#plType button'), function(b){
      b.addEventListener('click', function(){
        var nm = document.getElementById('plName').value, nt = document.getElementById('plNote').value;
        plDraft.type = b.getAttribute('data-t'); renderLog(main);
        document.getElementById('plName').value = nm; document.getElementById('plNote').value = nt;
      });
    });
    document.getElementById('plAdd').addEventListener('click', function(){
      var name = document.getElementById('plName').value.trim(), notes = document.getElementById('plNote').value.trim();
      if (!name){ plDraft.msg = 'Type who it is first.'; renderLog(main); return; }
      state.players = state.players || [];
      state.players.push({id:'p'+Date.now(), name:name, type:plDraft.type, notes:notes, t:Date.now()});
      if (state.players.length > 40) state.players = state.players.slice(-40);
      plDraft.msg = 'Added '+name+'.'; saveState(); renderLog(main);
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-pid]'), function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-pid'); state.players = (state.players||[]).filter(function(p){ return p.id!==id; });
        plDraft.msg = ''; saveState(); renderLog(main);
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-practice]'), function(b){
      b.addEventListener('click', function(){
        hs.kind = 'flop'; hs.opp = b.getAttribute('data-practice'); hs.street = 'mixed';
        if (state.mode!=='cash'){ state.mode = 'cash'; }
        startHandRound(false); state.tab = 'hands'; saveState(); renderAll();
      });
    });
  }

  function bankrollHtml(){
    var b = state.bankroll || {amount:0, buyin:0}, h = '<div class="section-title">Stakes check</div><div class="card">';
    h += '<p style="font-size:12.5px;color:var(--text-faint);margin-bottom:10px;line-height:1.5">Is your bankroll big enough for the games you play? Enter the money you set aside for poker and your usual cash buy-in.</p>';
    h += '<div class="form-grid"><div class="field"><label>Poker bankroll ($)</label><input type="number" id="brAmt" min="0" step="1" value="'+(b.amount||'')+'" placeholder="2000"></div>' +
      '<div class="field"><label>Usual buy-in ($)</label><input type="number" id="brBuy" min="0" step="1" value="'+(b.buyin||'')+'" placeholder="200"></div></div>';
    h += '<button class="submit-btn gold" id="brSave" style="margin-top:10px">Save</button>';
    if (b.amount>0 && b.buyin>0){
      var n = b.amount/b.buyin, msg, cls;
      if (n>=30){ msg = 'Comfortable. You can ride out a normal losing streak at this stake.'; cls = 'good'; }
      else if (n>=20){ msg = 'Okay for now. Stay at this stake until the bankroll grows.'; cls = 'mid'; }
      else { msg = 'Too thin for this stake. Drop down a level or add money. A bad run could wipe you out.'; cls = 'bad'; }
      h += '<div class="br-line '+cls+'"><b>'+(Math.round(n*10)/10)+'</b> buy-ins <span>'+esc(msg)+'</span></div>';
      h += '<div class="chart-note">Rule of thumb: 30 buy-ins for cash, 50 or more for tournaments (tournaments swing much more). Moving up needs about 30 buy-ins at the new stake.</div>';
    }
    var cash = state.sessions.filter(function(s){ return s.mode==='cash'; }), mtt = state.sessions.filter(function(s){ return s.mode==='mtt'; });
    var cNet = cash.reduce(function(s,x){ return s + x.cashout - x.buyin; },0), cMin = cash.reduce(function(s,x){ return s + (x.duration||0); },0);
    var tNet = mtt.reduce(function(s,x){ return s + x.cashout - x.buyin; },0), tIn = mtt.reduce(function(s,x){ return s + x.buyin; },0);
    if (cash.length || mtt.length){
      h += '<div class="seat-types">';
      if (cash.length) h += '<div><span>Cash net</span><b>'+fmtMoney(cNet)+'</b>'+(cMin>=60 ? ' <em>'+fmtMoney(Math.round(cNet/(cMin/60)))+'/hr</em>' : '')+'</div>';
      if (mtt.length) h += '<div><span>Tournament net</span><b>'+fmtMoney(tNet)+'</b>'+(tIn>0 ? ' <em>ROI '+Math.round(100*tNet/tIn)+'%</em>' : '')+'</div>';
      h += '</div>';
    }
    return h + '</div>';
  }
  function wireBankroll(main){
    document.getElementById('brSave').addEventListener('click', function(){
      state.bankroll = {amount: Math.max(0, parseFloat(document.getElementById('brAmt').value)||0), buyin: Math.max(0, parseFloat(document.getElementById('brBuy').value)||0)};
      saveState(); renderLog(main);
    });
  }

  function sparkline(sessions){
    var ordered = sessions.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var cum = 0; var pts = ordered.map(function(s){ cum += (s.cashout - s.buyin); return cum; });
    if (pts.length < 2) return '<div style="font-size:12.5px; color:var(--text-faint);">Log a couple more sessions to see a trend line.</div>';
    var w = 300, h = 56, pad = 6;
    var min = Math.min.apply(null, pts.concat([0])), max = Math.max.apply(null, pts.concat([0]));
    var range = (max-min) || 1;
    var stepX = (w - pad*2) / (pts.length-1);
    var path = pts.map(function(v,i){
      var x = pad + i*stepX;
      var y = h - pad - ((v-min)/range)*(h-pad*2);
      return (i===0?'M':'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var zeroY = h - pad - ((0-min)/range)*(h-pad*2);
    var last = pts[pts.length-1];
    var color = last >= 0 ? 'var(--felt-bright)' : 'var(--red-bright)';
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
      '<line x1="0" y1="'+zeroY.toFixed(1)+'" x2="'+w+'" y2="'+zeroY.toFixed(1)+'" stroke="var(--border)" stroke-width="1" />' +
      '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>' +
      '<div style="font-size:11.5px; color:var(--text-faint); margin-top:4px;">Cumulative result over logged sessions</div>';
  }

  /* ============================= INIT ============================= */

  loadState();
  renderAll();
  initSync();

})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http')===0) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
